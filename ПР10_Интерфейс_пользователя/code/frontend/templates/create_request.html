{% extends 'base.html' %}
{% block title %}Новая заявка — Конференции.РФ{% endblock %}
{% block content %}
<section class="card auth">
    <h1>Новая заявка</h1>
    <form class="form" id="request-form" novalidate>
        <div class="form-alert" data-form-alert hidden></div>

        <div class="field">
            <label for="room_id">Помещение</label>
            <select id="room_id" name="room_id" required>
                <option value="">— выберите помещение —</option>
                {% for room in rooms %}
                <option value="{{ room.id }}">{{ room.name }} (до {{ room.capacity }} чел.)</option>
                {% endfor %}
            </select>
            <div class="room-pick" data-room-pick>
                {% for room in rooms %}
                <input type="radio" name="room_pick" id="pick-{{ room.id }}" value="{{ room.id }}">
                <label for="pick-{{ room.id }}">
                    <img src="{{ url_for('static', filename=room.image) }}" alt="" width="72" height="52" loading="lazy">
                    <span>{{ room.name }}</span>
                </label>
                {% endfor %}
            </div>
            <div class="field__error" data-error-for="room_id"></div>
        </div>

        <div class="field">
            <label for="start_at">Дата и время начала конференции</label>
            <input id="start_at" name="start_at" type="text" placeholder="ДД.ММ.ГГГГ ЧЧ:ММ" maxlength="16" autocomplete="off" required>
            <span class="hint">Например: 05.11.2026 10:00</span>
            <div class="field__error" data-error-for="start_at"></div>
        </div>

        <div class="field">
            <label for="payment_method_id">Способ оплаты</label>
            <select id="payment_method_id" name="payment_method_id" required>
                <option value="">— выберите способ оплаты —</option>
                {% for p in payments %}
                <option value="{{ p.id }}">{{ p.name }}</option>
                {% endfor %}
            </select>
            <div class="field__error" data-error-for="payment_method_id"></div>
        </div>

        <button class="btn btn--primary btn--block" type="submit">Отправить</button>
    </form>
</section>
{% endblock %}
{% block scripts %}<script src="{{ asset('js/validation.js') }}" defer></script>
<script src="{{ asset('js/request.js') }}" defer></script>{% endblock %}
